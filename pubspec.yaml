name: bee_match3
description: "A data-driven match-3 puzzle game"
publish_to: 'none'

version: 1.0.3+111

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Game Engine
  flame: ^1.18.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3
  # firebase_crashlytics: ^4.1.3
  # firebase_remote_config: ^5.1.3

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Ads (commented for now, enable when ready)
  google_mobile_ads: ^5.2.0

  setgreet: ^1.0.1

  # Utilities
  equatable: ^2.0.5
  uuid: ^4.5.1
  go_router: ^14.2.0
  vector_math: ^2.2.0

  # Icons
  cupertino_icons: ^1.0.8
  audioplayers: ^6.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1

  # Testing
  mocktail: ^1.0.4

  # Linting
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/sprite/

  # Fonts (uncomment when SplineSans font files are added)
  # fonts:
  #   - family: SplineSans
  #     fonts:
  #       - asset: assets/fonts/SplineSans-Regular.ttf
  #       - asset: assets/fonts/SplineSans-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/SplineSans-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/SplineSans-Bold.ttf
  #         weight: 700
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icon.png"
  min_sdk_android: 21 # uygulamanın desteklediği minimum sdk
  adaptive_icon_background: "#ffffff" # Android için arka plan rengi
  adaptive_icon_foreground: "assets/icon.png" # Android için ön plan (logo)
