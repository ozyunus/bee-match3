<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Level Complete Success Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f9f506",
                        "primary-dark": "#c7c405", 
                        "background-light": "#f8f8f5",
                        "background-dark": "#23220f",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                    boxShadow: {
                        'btn-3d': '0 6px 0 0 #c7c405',
                        'btn-3d-hover': '0 4px 0 0 #c7c405',
                        'btn-3d-active': '0 0 0 0 #c7c405',
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 40;
        }
        /* Confetti Styles - Static positioning */
        .confetti { position: absolute; opacity: 0.8; z-index: 0; pointer-events: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col relative overflow-hidden text-[#23220f] dark:text-[#f8f8f5]">
<!-- Decorative Confetti Background (Static) -->
<div class="absolute inset-0 overflow-hidden pointer-events-none">
<div class="confetti top-[5%] left-[10%] w-3 h-3 bg-red-400 rounded-full"></div>
<div class="confetti top-[8%] right-[15%] w-4 h-2 bg-blue-400 rotate-45"></div>
<div class="confetti top-[15%] left-[25%] w-2 h-4 bg-primary rotate-12"></div>
<div class="confetti top-[12%] right-[25%] w-3 h-3 bg-purple-400 rounded-full"></div>
<div class="confetti top-[2%] left-[45%] w-2 h-2 bg-green-400 rotate-45"></div>
<div class="confetti top-[25%] left-[5%] w-3 h-5 bg-pink-400 -rotate-12"></div>
<div class="confetti top-[30%] right-[5%] w-2 h-2 bg-orange-400 rounded-full"></div>
<div class="confetti top-[40%] left-[85%] w-4 h-4 bg-teal-400 rotate-[30deg]"></div>
<div class="confetti top-[50%] left-[10%] w-2 h-3 bg-primary -rotate-45 opacity-50"></div>
<div class="confetti top-[18%] left-[60%] w-3 h-3 bg-rose-400 rounded-full opacity-60"></div>
</div>
<!-- Main Content Wrapper -->
<div class="relative z-10 w-full max-w-md mx-auto h-full min-h-screen flex flex-col px-6 py-4">
<!-- Header Section -->
<div class="flex-none pt-8 pb-4 flex flex-col items-center justify-center space-y-2">
<!-- Headline -->
<h1 class="text-4xl font-extrabold text-center leading-tight tracking-tight text-[#23220f] dark:text-white drop-shadow-sm">
                Level 5<br/><span class="text-4xl">Clear!</span>
</h1>
<!-- Star Rating -->
<div class="flex items-end justify-center gap-1 mt-4 h-24">
<!-- Star 1 -->
<div class="transform -rotate-12 translate-y-2">
<span class="material-symbols-outlined text-primary text-6xl drop-shadow-md">star</span>
</div>
<!-- Star 2 (Middle, elevated) -->
<div class="z-10 -translate-y-2 transform scale-110">
<span class="material-symbols-outlined text-primary text-7xl drop-shadow-lg">star</span>
</div>
<!-- Star 3 -->
<div class="transform rotate-12 translate-y-2">
<span class="material-symbols-outlined text-primary text-6xl drop-shadow-md">star</span>
</div>
</div>
</div>
<!-- Mascot & Stats Section -->
<div class="flex-1 flex flex-col items-center justify-start gap-6 mt-4">
<!-- Mascot Image Container -->
<div class="relative group">
<div class="absolute inset-0 bg-primary/20 blur-xl rounded-full transform scale-110"></div>
<div class="relative w-40 h-40 rounded-full border-[6px] border-white dark:border-zinc-800 shadow-xl overflow-hidden bg-white dark:bg-zinc-700">
<div class="w-full h-full bg-center bg-cover" data-alt="Happy cute cartoon animal mascot celebrating success" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCavByR3sJw4c3AWixsSCztQjjrcO7QrWxrjzm-7FUnD8w7WvJHyLujlEw5cfW_DIUH8eIhnl3W-hAGilYNsIlczrFn3Zq05XOdFHDHR0k8uKnQom-0Xh7rybSNqFdWU4mbkW_miuVgMgUgKV8cghy2bOGbuqp_QEMRmh2vX7csGvHlujAW_WIwV5DgTF7M7zKHk_mc3vDhZ-G0yXekSwj55MGIbH_l7xdRNQDdltVgJpgEwuBMnAKUWp4kAtLnqGEg1nydZ89N8fVr");'></div>
</div>
<!-- Decorative speech bubble indicator -->
<div class="absolute -top-2 -right-4 bg-white dark:bg-zinc-800 px-3 py-1 rounded-full shadow-md transform rotate-12 border border-primary/20">
<span class="text-xl">🎉</span>
</div>
</div>
<!-- Stats Grid -->
<div class="w-full grid grid-cols-2 gap-3 mt-2">
<!-- Main Score Card -->
<div class="col-span-2 bg-white dark:bg-zinc-800/80 p-5 rounded-lg border-2 border-primary/10 dark:border-zinc-700 shadow-sm flex flex-col items-center justify-center gap-1 backdrop-blur-sm">
<p class="text-zinc-500 dark:text-zinc-400 text-sm font-bold uppercase tracking-wider">Total Score</p>
<p class="text-[#23220f] dark:text-white text-5xl font-extrabold tracking-tight">12,450</p>
</div>
<!-- Secondary Stats -->
<div class="bg-white dark:bg-zinc-800/80 p-4 rounded-lg border-2 border-primary/10 dark:border-zinc-700 shadow-sm flex flex-col items-center justify-center gap-1 backdrop-blur-sm">
<p class="text-zinc-500 dark:text-zinc-400 text-xs font-bold uppercase tracking-wider">Moves Used</p>
<p class="text-[#23220f] dark:text-white text-2xl font-bold">4</p>
</div>
<div class="bg-white dark:bg-zinc-800/80 p-4 rounded-lg border-2 border-primary/10 dark:border-zinc-700 shadow-sm flex flex-col items-center justify-center gap-1 backdrop-blur-sm">
<p class="text-zinc-500 dark:text-zinc-400 text-xs font-bold uppercase tracking-wider">Best Combo</p>
<p class="text-primary text-2xl font-bold">x5</p>
</div>
</div>
</div>
<!-- Action Footer -->
<div class="flex-none pt-6 pb-8 space-y-6">
<!-- Primary Action: Next Level -->
<button class="w-full relative group h-16 bg-primary rounded-full shadow-btn-3d hover:shadow-btn-3d-hover active:shadow-btn-3d-active transform translate-y-0 hover:translate-y-[2px] active:translate-y-[6px] transition-all duration-150 ease-out flex items-center justify-center gap-3 overflow-hidden">
<div class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="text-[#23220f] text-xl font-extrabold uppercase tracking-wide z-10">Next Level</span>
<span class="material-symbols-outlined text-[#23220f] z-10 group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<!-- Secondary Actions -->
<div class="flex justify-center items-center gap-8">
<button class="flex flex-col items-center gap-2 group">
<div class="w-12 h-12 rounded-full bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 shadow-sm flex items-center justify-center group-hover:scale-110 group-active:scale-95 transition-all text-zinc-600 dark:text-zinc-300 group-hover:text-primary-dark dark:group-hover:text-primary">
<span class="material-symbols-outlined text-[24px]">replay</span>
</div>
<span class="text-xs font-semibold text-zinc-500 dark:text-zinc-400 uppercase tracking-wide">Replay</span>
</button>
<button class="flex flex-col items-center gap-2 group">
<div class="w-12 h-12 rounded-full bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 shadow-sm flex items-center justify-center group-hover:scale-110 group-active:scale-95 transition-all text-zinc-600 dark:text-zinc-300 group-hover:text-primary-dark dark:group-hover:text-primary">
<span class="material-symbols-outlined text-[24px]">home</span>
</div>
<span class="text-xs font-semibold text-zinc-500 dark:text-zinc-400 uppercase tracking-wide">Home</span>
</button>
<button class="flex flex-col items-center gap-2 group">
<div class="w-12 h-12 rounded-full bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 shadow-sm flex items-center justify-center group-hover:scale-110 group-active:scale-95 transition-all text-zinc-600 dark:text-zinc-300 group-hover:text-primary-dark dark:group-hover:text-primary">
<span class="material-symbols-outlined text-[24px]">ios_share</span>
</div>
<span class="text-xs font-semibold text-zinc-500 dark:text-zinc-400 uppercase tracking-wide">Share</span>
</button>
</div>
</div>
</div>
</body></html>
